<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopOS Auth Prototype</title>
<style>
:root{--bg:#f3f8f5;--sf:#fff;--ink:#0a3f2c;--mu:#4d6e5f;--ln:#cfe2d7;--mint:#e3f3ea;--ac:#0b5a3c;--er:#b3261e;--pb:#0a3f2c;--pt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06261b;--sf:#0b3a29;--ink:#e6f2ec;--mu:#a9c7b8;--ln:#1d5440;--mint:#124a35;--ac:#34e8a0;--er:#ff8a80;--pb:#34e8a0;--pt:#06261b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#06402b;color:#fff;padding:8px 14px;display:flex;gap:6px;align-items:center;overflow-x:auto}
#bar b{margin-right:8px;white-space:nowrap}
#bar button{white-space:nowrap;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
#bar button.on{background:#34e8a0;color:#06402b;border-color:#34e8a0;font-weight:600}
#tp{background:var(--sf);border-bottom:1px solid var(--ln);padding:14px 18px;font-size:13px;overflow-x:auto}
#tp table{border-collapse:collapse;min-width:620px}#tp td,#tp th{padding:5px 12px 5px 0;text-align:left}#tp code{background:var(--mint);padding:1px 6px;border-radius:5px}
#tp button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
.wrap{display:flex;min-height:680px}
.L{position:relative;flex:0 0 58%;background:#06402b;color:#fff;overflow:hidden;padding:48px}
.L .ring{position:absolute;right:-320px;top:60px;width:640px;height:640px;border-radius:50%;background:rgba(255,255,255,.05)}
.L img{position:absolute;right:0;top:115px;width:258px;height:530px;object-fit:cover;border-radius:265px 0 0 265px}
.br{display:flex;align-items:center;gap:14px}.lg{width:56px;height:56px;border-radius:15px;background:#f3f8f5;color:#0b5a3c;display:flex;align-items:center;justify-content:center}
.hero{position:absolute;left:48px;top:240px;width:460px}
.kick{font-size:12px;letter-spacing:2.5px;color:#34e8a0;font-weight:600}
.hero h2{font-size:48px;line-height:1.1;margin:16px 0;letter-spacing:-1.2px}.hero h2 span{color:#34e8a0}
.R{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:480px;background:var(--sf);border-radius:22px;box-shadow:0 10px 40px rgba(6,64,43,.12);padding:34px}
.card h1{margin:14px 0 6px;font-size:30px;letter-spacing:-.7px}.card p{margin:0;color:var(--mu)}
.ico{width:52px;height:52px;border-radius:15px;background:var(--mint);color:var(--ac);display:flex;align-items:center;justify-content:center}
.lb{display:block;font-weight:600;margin:16px 0 6px;font-size:14px}
.in{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:12px;padding:0 12px;height:48px;background:var(--sf);color:var(--ac)}
.in:focus-within,textarea:focus{outline:2px solid var(--ac)}
.in input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);height:100%;outline:0;min-width:0}
.ey{border:0;background:none;color:var(--ac);cursor:pointer;display:flex}
textarea{width:100%;min-height:90px;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit;background:var(--sf);color:var(--ink);resize:vertical}
.er{color:var(--er);font-size:13px;min-height:0;margin-top:4px}
.bn{border-radius:10px;padding:0;font-size:14px}.bn.e,.bn.k{padding:10px 12px;margin-top:12px}.bn.e{background:rgba(179,38,30,.1);color:var(--er)}.bn.k{background:var(--mint);color:var(--ac)}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:12px;font:600 15px inherit;font-family:inherit;cursor:pointer;margin-top:12px;border:1px solid transparent}
.bt.p{background:var(--pb);color:var(--pt)}.bt.o{background:var(--sf);color:var(--ink);border-color:var(--ln)}.bt:disabled{opacity:.6;cursor:wait}
.bt:focus-visible,a:focus-visible,.ey:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lk{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center}
.ck{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--mu);font-size:14px}
.box{display:flex;gap:12px;background:var(--mint);border-radius:12px;padding:14px;margin:18px 0 4px;color:var(--mu);font-size:13px}
.rl{list-style:none;padding:0;margin:8px 0 0;font-size:13px;color:var(--mu)}.rl li:before{content:"○ "}.rl li.ok{color:var(--ac)}.rl li.ok:before{content:"✓ "}
.mt{display:flex;gap:10px;margin-top:6px}.mt label{flex:1;border:1px solid var(--ln);border-radius:12px;padding:12px;cursor:pointer;font-size:14px}.mt label.on{border-color:var(--ac);background:var(--mint)}
.dv{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--mu);font-size:11px;letter-spacing:2px}.dv:before,.dv:after{content:"";flex:1;height:1px;background:var(--ln)}
.ft{display:flex;margin-top:6px}.ft div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.ft i{display:flex;margin:0 auto 6px;width:38px;height:38px;border-radius:11px;background:var(--mint);color:var(--ac);align-items:center;justify-content:center}
.dash{max-width:760px;margin:40px auto;padding:0 20px}.dash .card{max-width:none}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:12px 14px;margin-top:10px;font:inherit;cursor:pointer}.opt small{color:var(--mu)}.opt em{font-style:normal;font-size:12px;color:var(--mu)}.opt.on{border-color:var(--ac);background:var(--mint)}.opt:disabled{opacity:.55;cursor:not-allowed}
@keyframes sp{to{transform:rotate(360deg)}}.spin{display:inline-flex;animation:sp 1s linear infinite}.stp{list-style:none;padding:0;margin:16px 0 0}.stp li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--mu)}.stp li.ok{color:var(--ac)}
@media(max-width:900px){.L{display:none}}
</style></head>

const R={
login:()=>['Smarter checkouts.<br>Better inventory.','A stronger business.','ShopOS helps you manage your store, track your stock and serve your customers — all in one place.',`<h1>Welcome back</h1><p>Sign in to your ShopOS account and continue managing your store.</p><form data-f="login" novalidate>${F('em','Email address','email','name@yourstore.co.zw','mail')}<div class="row"><span class="lb" style="margin:0">Password</span><button type="button" class="lk" data-go="forgot">Forgot password?</button></div><div class="in" style="margin-top:6px">${ic(P.lock)}<input id="pw" type="password" placeholder="Enter your password" aria-label="Password"><button type="button" class="ey" data-act="eye" data-t="pw" aria-label="Show or hide password">${ic(P.eye)}</button></div><div class="er" id="e-pw" role="alert"></div><label class="ck"><input type="checkbox"> Keep me signed in on this device</label><div class="bn" id="bn"></div>${B('Sign in '+ic(P.ar,18),'p')}</form><div class="dv">DEVELOPMENT</div><p style="text-align:center;font-size:12px">Use “Test accounts” in the top bar to fill credentials.</p>`],
forgot:()=>['Forgot your<br>','password?','No worries! Enter your email address and we’ll send you a secure link to reset your password.',S.sent?`${back('login','Back to sign in')}<h1>Check your email</h1><div class="box">${ic(P.mail)}<div>If an account exists for <b>${S.fe}</b>, we’ve sent a link to reset your password.</div></div><div class="bn" id="bn"></div>${B('Open reset link (demo) '+ic(P.ar,18),'p','data-act="open"')}${B('Resend link','o','data-act="resend"')}`:`${back('login','Back to sign in')}<h1>Forgot password?</h1><p>Enter your email address and we’ll send you a link to reset your password.</p><form data-f="forgot" novalidate>${F('em','Email address','email','name@yourstore.co.zw','mail')}${B('Send recovery link '+ic(P.ar,18),'p')}</form><div class="dv">OR</div>${B('Back to sign in','o','data-go="login"')}`],
reset:()=>['New password,<br>','same great access.','Create a strong password to keep your ShopOS account safe and secure.',`${back('login','Back to sign in')}<h1>Reset Password</h1><p>Create a new password for your ShopOS account.</p><form data-f="reset" novalidate>${F('np','New password','password','Enter new password','lock',1)}<ul class="rl" id="rl"><li>At least 8 characters</li><li>One uppercase letter</li><li>One number</li><li>One special character (e.g. !@#$%)</li></ul>${F('cp','Confirm new password','password','Confirm new password','lock',1)}${B('Reset password '+ic(P.ar,18),'p')}</form>`],
verify:()=>['Verify your<br>','account.','Help us keep your account safe and active. Complete the verification process to continue using ShopOS.',S.step==2?`${back('login','Back to sign in')}<h1>Enter your code</h1><p>We sent a 6-digit code to ${S.vt||'your contact'}. Demo code: <b>123456</b></p><form data-f="code" novalidate>${F('cd','Verification code','text','6-digit code','sh')}${B('Verify account '+ic(P.ar,18),'p')}</form>`:`${back('login','Back to sign in')}<h1>Account Verification</h1><p>Verify/activate your account, if required.</p><div class="box">${ic(P.sh,26)}<div><b>We’re almost there!</b><br>To keep your account secure, please verify your email address or phone number.</div></div><form data-f="send" novalidate><span class="lb">Verification method</span><div class="mt"><label class="${S.method=='email'?'on':''}"><input type="radio" name="m" ${S.method=='email'?'checked':''} data-act="m" data-v="email"> Email verification</label><label class="${S.method=='phone'?'on':''}"><input type="radio" name="m" ${S.method=='phone'?'checked':''} data-act="m" data-v="phone"> Phone verification</label></div>${S.method=='email'?F('vf','Email address','email','name@yourstore.co.zw','mail'):F('vf','Phone number','tel','+263 77 123 4567','ph')}${B('Send verification code '+ic(P.ar,18),'p')}</form><div class="dv">OR</div><p style="text-align:center"><button class="lk" data-act="have">I already have a verification code</button></p>`],
disabled:()=>['Access<br>','restricted.','Your account is currently disabled. Please contact your administrator for help.',`${back('login','Back to sign in')}<div class="ico">${ic(P.ban,26)}</div><h1>Account disabled</h1><p>Your account has been disabled and can’t be used to sign in right now.</p><div class="box">${ic(P.info,22)}<div>Access to ShopOS is restricted for this account. Contact your store administrator to have it re-enabled.</div></div><div class="bn" id="bn"></div>${B('Contact administrator','p','data-act="contact"')}${B('Back to sign in','o','data-go="login"')}`],
branch:()=>{const a=S.user.br,L=BR.filter(b=>a.includes(b.id)),X=BR.filter(b=>!a.includes(b.id)).slice(0,1);return['Where are you<br>','working today?','Pick the branch you’re authorised to work at. You can switch branches later.',`${back('login','Back to sign in').replace('data-go="login"','data-act="diff"')}<div class="ico">${ic(P.pin,26)}</div><h1>Select a branch</h1><p>Choose the branch you’re working at today. Only branches you’re authorised for can be picked.</p><form data-f="branch">${L.map(b=>`<button type="button" class="opt ${S.bsel===b.id?'on':''}" data-act="pick" data-k="b" data-i="${b.id}"><span><b>${b.n}</b><br><small>${b.c}</small></span><em>${S.bsel===b.id?'Selected':'Authorised'}</em></button>`).join('')}${X.map(b=>`<button type="button" class="opt" disabled><span><b>${b.n}</b><br><small>${b.c}</small></span><em>Not authorised</em></button>`).join('')}<div class="er" id="e-bsel" role="alert"></div>${B('Continue '+ic(P.ar,18),'p',S.bsel?'':'disabled')}</form>`]},
till:()=>{const d=DV(S.branch);return['Pick your<br>','till.','Select an assigned POS device to start taking sales.',`${back(S.user.br.length>1?'branch':'login','Change branch').replace(S.user.br.length>1?'':'data-go="login"','data-act="diff"')}<div class="ico">${ic(P.dev,26)}</div><h1>Select a till</h1><p>Choose the POS device assigned to you at ${S.branch.n}.</p><form data-f="till">${d.map((x,i)=>`<button type="button" class="opt ${S.tsel===i?'on':''}" ${x[2]!='Available'?'disabled':''} data-act="pick" data-k="t" data-i="${i}"><span><b>${x[0]}</b><br><small>${x[1]}</small></span><em>${S.tsel===i?'Selected':x[2]}</em></button>`).join('')}<div class="er" id="e-tsel" role="alert"></div>${B('Start session '+ic(P.ar,18),'p',S.tsel!==undefined&&S.tsel!==null?'':'disabled')}</form>`]},
refresh:()=>['Restoring<br>','your session.','Your access token expired. We’re refreshing it securely so you can carry on without signing in again.',`<div class="ico"><span class="spin">${ic(P.rf,26)}</span></div><h1>Restoring your session</h1><p>Please wait while we refresh your access.</p><ul class="stp"><li class="ok">${ic(P.sh,18)} Access token expired</li><li>${'<span class="spin">'+ic(P.rf,18)+'</span>'} Requesting a new access token…</li><li>${ic(P.lock,18)} Restoring your session</li></ul>${B('Cancel and sign in','o','data-act="rcancel"')}`],
expired:()=>['Session expired.<br>','Please sign in again.','For your security, we signed you out after a period of inactivity. Sign in to pick up where you left off.',`<div class="ico">${ic(P.clock,26)}</div><h1>Session expired</h1><p>Your session has timed out. Please authenticate again to continue managing your store.</p><div class="box">${ic(P.info,22)}<div>Your account is safe. No changes were made while you were signed out.</div></div>${B('Sign in again '+ic(P.ar,18),'p','data-go="login"')}${B('Use a different account','o','data-act="diff"')}`],
logout:()=>['Leaving so soon?<br>','Log out safely.','Make sure your shift is wrapped up before you go. You can sign back in at any time.',`${back(S.user?'dashboard':'login','Back to dashboard')}<div class="ico">${ic(P.out,26)}</div><h1>Log out of ShopOS?</h1><p>You will need to sign in again to access your store and registers.</p><div class="box">${ic(P.info,22)}<div>Finish or hold any open sale before logging out so nothing is left pending.</div></div>${B('Log out '+ic(P.ar,18),'p','data-act="out"')}${B('Stay signed in','o','data-go="'+(S.user?'dashboard':'login')+'"')}`],
denied:()=>['Access denied.<br>','Permission needed.','Your account does not have the permissions required to open this page.',`${back('login','Back to sign in')}<div class="ico">${ic(P.shx,26)}</div><h1>Access denied</h1><p>You don’t have permission to view this page. If you think this is a mistake, contact your store administrator.</p><div class="box">${ic(P.info,22)}<div>Requested page: Reports. Required role: Manager.</div></div>${S.done?`<div class="bn k" id="bn">Request sent. Your administrator will be notified.</div>`:S.ask?`<form data-f="req" novalidate><label class="lb" for="rq">Why do you need access?</label><textarea id="rq" placeholder="Write a short reason (at least 10 characters)"></textarea><div class="er" id="e-rq" role="alert"></div>${B('Send request','p')}${B('Cancel','o','type="button" data-act="cancel"')}</form>`:B('Back to dashboard '+ic(P.ar,18),'p','data-go="'+(S.user?'dashboard':'login')+'"')+B('Request access','o','data-act="ask"')}<div class="bn" id="bn"></div>`]};
const $=id=>document.getElementById(id),val=id=>($(id)||{}).value||'';
const er=(id,m)=>{$('e-'+id).textContent=m;$(id).setAttribute('aria-invalid','true')};
const clr=()=>document.querySelectorAll('.er').forEach(x=>x.textContent='');
const bn=(m,k)=>{const b=$('bn');if(b){b.className='bn '+(k?'k':'e');b.textContent=m}};
const go=h=>{if(location.hash.slice(1)===h)render();else location.hash=h};
const mailOk=e=>/^\S+@\S+\.\S+$/.test(e);
function busy(f,fn){const b=f.querySelector('.bt.p');b.disabled=true;const h=b.innerHTML;b.textContent='Please wait…';setTimeout(()=>{b.disabled=false;b.innerHTML=h;fn()},600)}
function chk(id,e){clr();if(!e){er(id,'Enter your email address');return 0}if(!mailOk(e)){er(id,'Enter a valid email address');return 0}return 1}
function after(){const u=S.user;if(!S.branch){if(u.br.length==1)S.branch=BR.find(b=>b.id==u.br[0]);else return go('branch')}if(u.r!='Viewer'&&!S.till)return go('till');const r=S.ret||'dashboard';S.ret='';go(r)}
const H={branch(f){if(!S.bsel){er('bsel','Select a branch to continue');return}busy(f,()=>{S.branch=BR.find(b=>b.id==S.bsel);S.till=0;S.tsel=null;after()})},
till(f){if(S.tsel===null||S.tsel===undefined){er('tsel','Select a till to continue');return}busy(f,()=>{S.till=DV(S.branch)[S.tsel];after()})},

login(f){clr();const e=val('em').trim().toLowerCase(),p=val('pw');let ok=1;if(!e){er('em','Enter your email address');ok=0}else if(!mailOk(e)){er('em','Enter a valid email address');ok=0}if(!p){er('pw','Enter your password');ok=0}if(!ok)return;busy(f,()=>{const u=U.find(x=>x.e===e&&x.p===p);if(!u)return bn('Incorrect email or password.');if(u.d)return go('disabled');if(!u.v){S.pend=u;return go('verify')}if(!S.ret){S.branch=0;S.till=0;S.bsel=0;S.tsel=null}S.user=u;after()})},
forgot(f){const e=val('em').trim().toLowerCase();if(!chk('em',e))return;busy(f,()=>{S.fe=e;S.sent=1;S.n=1;render()})},
reset(f){clr();const p=val('np');if(!rules()){er('np','Password does not meet all the rules');return}if(p!==val('cp')){er('cp','Passwords do not match');return}busy(f,()=>{const u=U.find(x=>x.e===S.fe);if(u)u.p=p;S.msg='Password updated. Sign in with your new password.';go('login')})},
send(f){clr();const v=val('vf').trim();if(!v){er('vf','Enter your '+(S.method=='email'?'email address':'phone number'));return}if(S.method=='email'?!mailOk(v):!/^\+?[\d\s]{9,15}$/.test(v)){er('vf','Enter a valid '+(S.method=='email'?'email address':'phone number'));return}busy(f,()=>{S.vt=v;S.step=2;render()})},
code(f){clr();const c=val('cd').trim();if(!c){er('cd','Enter the 6-digit code');return}if(c!=='123456'){er('cd','That code is incorrect or expired.');return}busy(f,()=>{S.step=1;if(S.pend){S.pend.v=1;S.user=S.pend;S.pend=null;after()}else{S.msg='Account verified. You can sign in.';go('login')}})},
req(f){clr();if(val('rq').trim().length<10){er('rq','Write at least 10 characters');return}busy(f,()=>{S.done=1;S.ask=0;render()})}};
function rules(){const p=val('np'),t=[/.{8}/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].map(r=>r.test(p));document.querySelectorAll('#rl li').forEach((l,i)=>l.className=t[i]?'ok':'');return t.every(Boolean)}
const A={eye(t){const i=$(t.dataset.t);i.type=i.type=='password'?'text':'password'},
m(t){S.method=t.dataset.v;render()},have(){S.step=2;render()},open(){go('reset')},
resend(){if(++S.n>3)bn('Too many requests. Try again later.');else bn('Recovery link sent again.',1)},
diff(){S.user=null;S.branch=0;S.till=0;go('login')},contact(){bn('Request sent. Your administrator has been notified.',1)},pick(t){if(t.dataset.k=='b')S.bsel=t.dataset.i;else S.tsel=+t.dataset.i;render()},rcancel(){clearTimeout(S.tm);S.user=null;go('login')},rfo(){S.rf='ok';go('refresh')},rff(){S.rf='fail';go('refresh')},sw(){S.branch=0;S.till=0;S.bsel=0;S.tsel=null;go('branch')},out(){S.user=null;S.branch=0;S.till=0;S.msg='You have been logged out.';go('login')},ask(){S.ask=1;render()},cancel(){S.ask=0;render()},
use(t){const u=U[t.dataset.i];S.panel=0;S.fill=u;go('login')},tp(){S.panel=!S.panel;render()}};
function dash(){const u=S.user,nt=S.note||'You are signed in. Try the actions below.';S.note='';return `<div class="dash"><div class="card"><div class="row"><div><div class="kick" style="color:var(--ac)">DASHBOARD</div><h1 style="margin:6px 0">Welcome, ${u.n}</h1><p>${u.r} · ${u.e}${S.branch?' · '+S.branch.n:''}${S.till?' · '+S.till[0]:''}</p></div><div class="lg" style="background:var(--mint)">${ic(P.cart,30)}</div></div><div class="bn k" id="bn">${nt}</div><div class="g">${B('Open Reports','p','data-act="rep"')}${B('Simulate session timeout','o','data-act="exp"')}${u.br.length>1?B('Switch branch','o','data-act="sw"'):''}${B('Token refresh (succeeds)','o','data-act="rfo"')}${B('Token refresh (fails)','o','data-act="rff"')}${B('Log out','o','data-go="logout"')}</div></div></div>`}
A.rep=()=>{if(S.user.r==='Manager')bn('Reports opened (demo). You have Manager access.',1);else go('denied')};
A.exp=()=>{S.user=null;S.ret='dashboard';go('expired')};
function render(){let r=location.hash.slice(1)||'login';if(r!=='dashboard'&&!R[r])r='login';if(r==='dashboard'&&!S.user)r='login';clearTimeout(S.tm);if(['branch','till','refresh'].includes(r)&&!S.user){S.user=U[1]}if(r=='till'&&!S.branch)S.branch=BR[0];
$('bar').innerHTML=`<b>ShopOS prototype</b>`+SC.map((s,i)=>`<button class="${s[0]==r?'on':''}" data-go="${s[0]}">${i+1} ${s[1]}</button>`).join('')+`<button data-act="tp">Test accounts ▾</button>`;
$('tp').hidden=!S.panel;$('tp').innerHTML=`<table><tr><th>Email</th><th>Password</th><th>Outcome</th><th></th></tr>${U.map((u,i)=>`<tr><td><code>${u.e}</code></td><td><code>${u.p}</code></td><td>${u.o}</td><td><button data-act="use" data-i="${i}">Use</button></td></tr>`).join('')}</table><p>Verification code: <code>123456</code>. Forgot password works for any listed email.</p>`;
if(r==='dashboard'){$('app').innerHTML=dash();return}
const s=R[r](),m=S.msg;$('app').innerHTML=`<div class="wrap"><div class="L"><div class="ring"></div><img src="${IMG}" alt="Supermarket aisle with a shopping cart"><div class="br"><div class="lg">${ic(P.cart,30)}</div><div><div style="font:700 30px system-ui">ShopOS</div><div style="font-size:12px;letter-spacing:1.2px;color:#cfe6da">GROCERY &amp; SUPERMARKET POS</div></div></div><div class="hero"><div class="kick">— BUILT FOR MODERN RETAIL</div><h2>${s[0]}<span>${s[1]}</span></h2><p style="font-size:17px;color:#e6f2ec">${s[2]}</p></div></div><div class="R"><div class="card">${s[3]}${r=='login'||r=='reset'?'':''}<div class="dv">SECURE &amp; ENCRYPTED</div>${FT}</div></div></div>`;
if(r=='login'&&S.fill){$('em').value=S.fill.e;$('pw').value=S.fill.p;S.fill=0}
if(r=='login'&&m){bn(m,1);S.msg=''}
if(r=='verify'&&S.pend&&$('vf')&&S.method=='email')$('vf').value=S.pend.e;
if(r=='refresh'){S.tm=setTimeout(()=>{if(location.hash!='#refresh')return;if(S.rf=='fail'){S.user=null;S.ret='dashboard';go('expired')}else{S.note='Session restored. You stayed signed in.';go('dashboard')}},2200)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act]');if(!t)return;if(t.dataset.act){A[t.dataset.act](t)}else{S.step=1;go(t.dataset.go)}});
document.addEventListener('submit',e=>{e.preventDefault();H[e.target.dataset.f](e.target)});
document.addEventListener('input',e=>{if(e.target.id=='np')rules()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&location.hash=='#logout')go(S.user?'dashboard':'login')});
addEventListener('hashchange',render);render();
</script></body></html>
