name: Task
description: A piece of work for the backlog
labels: [task]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, infra, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that prove it works
