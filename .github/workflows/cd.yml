name: CD

# Every merge to main: test, build one image, deploy it to staging.
# Production is a separate manual workflow (deploy-production.yml) that
# promotes the SAME image.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopos

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "image=${IMAGE,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      # Hosting provider is still an open decision (tech doc §12).
      # Replace this step with the real deploy once it is chosen; keep
      # credentials in the "staging" environment secrets.
      - run: |
          echo "Deploying ${{ needs.publish.outputs.image }} to staging"
          echo "FISCAL_ADAPTER=FDMS_TEST"
          echo "To promote: run 'Deploy production' with sha ${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"
