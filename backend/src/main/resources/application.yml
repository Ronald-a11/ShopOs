spring:
  application:
    name: shopos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopos}
    username: ${DB_USERNAME:shopos}
    password: ${DB_PASSWORD:shopos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shopos:
  cors:
    # Comma-separated origins for browser clients (frontend on other machines)
    origins: ${SHOPOS_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  fiscal:
    # MOCK for local and CI, FDMS_TEST for staging, FDMS_LIVE only after ZIMRA approval
    adapter: ${FISCAL_ADAPTER:MOCK}
  auth:
    seed-demo-user: ${SHOPOS_SEED_DEMO_USER:true}
    access-token-ttl: ${AUTH_ACCESS_TTL:15m}
    refresh-token-ttl: ${AUTH_REFRESH_TTL:7d}
    remember-refresh-token-ttl: ${AUTH_REMEMBER_REFRESH_TTL:30d}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:1h}
    verification-code-ttl: ${AUTH_VERIFICATION_TTL:10m}
    access-cookie-name: shopos_at
    refresh-cookie-name: shopos_rt
    cookie-path: /api
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: Lax
